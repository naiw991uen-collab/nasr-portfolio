<section class="sec process" id="process">
  <div class="wrap">
    <div class="head">
      <h2 class="h2 reveal-title"><span class="line"><span>{{ t().process.title1 }}</span></span><span class="line"><span>{{ t().process.title2 }}</span></span></h2>
      <p>{{ t().process.intro }}</p>
    </div>
    <div class="stack-cards">
      @for (c of cards; track c.k; let i = $index) {
        <article class="scard">
          <div class="k" aria-hidden="true">{{ c.k }}</div>
          <div>
            <h3>{{ t().process.cards[i].title }}</h3>
            <p>{{ t().process.cards[i].body }}</p>
            <code appScramble dir="ltr">{{ c.code }}</code>
          </div>
        </article>
      }
    </div>
  </div>
</section>
