<div class="progress" #bar aria-hidden="true"></div>

<header class="nav" #header>
  <div class="wrap nav-in">
    <a class="logo" href="#top" [attr.aria-label]="t().nav.logoAria" dir="ltr">NM<b>.</b></a>
    <nav class="nav-links mono" [attr.aria-label]="t().nav.sectionsAria">
      @for (l of links(); track l.href) {
        <a [href]="l.href" appScramble>{{ l.label }}</a>
      }
    </nav>
    <div class="nav-right">
      <a class="cv mono" appMagnetic [href]="cv" download="Nasr-Mohamed-CV.pdf" [attr.aria-label]="t().common.cvAria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 20h14" /></svg>
        <span class="cv-lbl">CV</span>
      </a>
      <div class="palette" role="group" [attr.aria-label]="t().nav.themeAria">
        @for (p of palettes; track p.id) {
          <button
            type="button"
            [attr.aria-label]="t().nav.themes[p.id]"
            [attr.aria-pressed]="theme.palette() === p.id"
            [style.background]="p.swatch"
            (click)="theme.set(p.id)"
          ></button>
        }
      </div>

      <!-- Language: globe button + small menu (closes on outside click, Escape or Tab away). -->
      <div class="lang" #langBox (focusout)="onFocusOut($event)" (keydown)="onMenuKey($event)">
        <button
          #langBtn
          type="button"
          class="globe"
          [attr.aria-label]="t().nav.langAria"
          aria-haspopup="menu"
          [attr.aria-expanded]="open()"
          aria-controls="lang-menu"
          (click)="toggle()"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" />
          </svg>
        </button>
        <ul id="lang-menu" class="lang-menu" role="menu" [attr.aria-label]="t().nav.langAria" [class.open]="open()">
          @for (l of langs; track l.id) {
            <li role="none">
              <button
                type="button"
                role="menuitemradio"
                [attr.aria-checked]="i18n.lang() === l.id"
                [attr.lang]="l.id"
                [attr.tabindex]="open() ? 0 : -1"
                (click)="choose(l.id)"
              >
                <span class="lang-name">
                  <!-- Small inline SVG flags (flag emoji don't render on Windows). -->
                  <span class="flag" aria-hidden="true">
                    @switch (l.id) {
                      @case ('en') {
                        <svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice">
                          <clipPath id="flag-uk-t"><path d="M30 15h30v15zv15H0zH0V0zV0h30z" /></clipPath>
                          <path d="M0 0h60v30H0z" fill="#012169" />
                          <path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6" />
                          <path d="M0 0l60 30m0-30L0 30" stroke="#C8102E" stroke-width="4" clip-path="url(#flag-uk-t)" />
                          <path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10" />
                          <path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6" />
                        </svg>
                      }
                      @case ('ar') {
                        <svg viewBox="0 0 30 20" preserveAspectRatio="xMidYMid slice">
                          <path d="M0 0h30v20H0z" fill="#fff" />
                          <path d="M0 0h30v6.67H0z" fill="#CE1126" />
                          <path d="M0 13.33h30V20H0z" fill="#000" />
                          <!-- Eagle of Saladin, simplified to read at this size. -->
                          <g fill="#C09300">
                            <path d="M15 7.2c.6 0 1 .4 1 .9l-.2.5 2.6-.9-.6 1.4 1.1-.2-1.3 1.6-1.1.3v1.6l.8.9h-4.6l.8-.9v-1.6l-1.1-.3-1.3-1.6 1.1.2-.6-1.4 2.6.9-.2-.5c0-.5.4-.9 1-.9z" />
                          </g>
                        </svg>
                      }
                      @case ('de') {
                        <svg viewBox="0 0 30 20" preserveAspectRatio="xMidYMid slice">
                          <path d="M0 0h30v6.67H0z" fill="#000" />
                          <path d="M0 6.67h30v6.66H0z" fill="#DD0000" />
                          <path d="M0 13.33h30V20H0z" fill="#FFCE00" />
                        </svg>
                      }
                    }
                  </span>
                  {{ l.label }}
                </span>
                <small class="mono">{{ l.id }}</small>
              </button>
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
</header>
