  <!-- PNG fallback first; browsers that support SVG icons pick the SVG. -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script>
    // Every refresh starts at the top (so the intro is seen): the browser must not restore
    // the old scroll position. Set here, before the page renders, so restoration never happens.
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  </script>
  <script>
    // Apply the saved palette before first paint (no flash of the default theme).
    try {
      var p = localStorage.getItem('palette');
      if (p === 'ember' || p === 'paper') document.documentElement.setAttribute('data-palette', p);
    } catch (e) {}
  </script>
  <script>
    // Let scroll/wheel/touch listeners bypass zone.js. Zone merges listeners of one event type
    // into a single native listener, so ScrollTrigger's passive wheel listener made Lenis's
    // passive:false one passive too (console errors, no preventDefault). Also saves change
    // detection on every scroll frame. No template binds to these events.
    window.__zone_symbol__UNPATCHED_EVENTS = ['scroll', 'wheel', 'touchstart', 'touchmove', 'touchend'];
  </script>
  <!-- Without JS the loader would never leave: hide it. -->
  <noscript><style>.loader { display: none !important; }</style></noscript>
